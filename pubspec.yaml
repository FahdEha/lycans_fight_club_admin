name: lycans_fight_club_admin
description: "Lycans Admin"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.14.0
  firebase_auth: 6.6.0
  firebase_database: 12.5.0
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  qr_flutter: ^4.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  pdf: ^3.10.8
  fl_chart: ^1.2.0
  printing: ^5.12.0
#  qr_code_scanner: ^1.0.0
  mobile_scanner: ^7.4.0
  csv: ^8.0.0
  crypto: ^3.0.3
  image_picker: ^1.0.7

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
    android: "ic_launcher"
    ios: true
    image_path: "assets/icon/lycans_png.png"
    min_sdk_android: 21 # android min sdk min:16, default 21
    web:
      generate: true
      image_path: "assets/icon/lycans_png.png"
      background_color: "#000000"
      theme_color: "#hexcode"

flutter:
  uses-material-design: true

  assets:
    - assets/images/